name: Apply integration repairs

on:
  push:
    branches:
      - feature/upstream-full-integration
    paths:
      - tools/integration-repair.mjs
      - .github/workflows/integration-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v7
        with:
          ref: feature/upstream-full-integration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch upstream source
        shell: bash
        run: |
          git remote add upstream https://github.com/prem-k-r/MaterialYouNewTab.git 2>/dev/null || true
          git fetch upstream main

      - name: Apply deterministic repairs
        run: node tools/integration-repair.mjs

      - name: Commit repaired files
        shell: bash
        run: |
          set -euo pipefail

          # GitHub Actions may update repository files, but this token is not
          # allowed to create or modify a separate workflow file. The final
          # QA workflow update is committed through the GitHub connector.
          git restore --source=HEAD -- .github/workflows/qa.yml

          if git diff --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reconcile upstream integration conflicts"
          git push origin HEAD:feature/upstream-full-integration

      - name: Run customization checks
        run: node tools/check-customizations.mjs

      - name: Run release metadata checks
        run: node tools/check-release-metadata.mjs

      - name: Run upstream integration checks
        run: node tools/check-upstream-integration.mjs
