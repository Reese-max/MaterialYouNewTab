name: Apply reviewed AI hardening

on:
  push:
    branches:
      - feature/ai-assist-3.5.0
    paths:
      - .github/workflows/apply-reviewed-ai-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-reviewed-ai-hardening
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and validate reviewed hardening
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout AI Assist branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/ai-assist-3.5.0
          fetch-depth: 0

      - name: Reconstruct and verify reviewed payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded="${RUNNER_TEMP}/ai-hardening-payload.b64"
          payload="${RUNNER_TEMP}/ai-hardening-modular-payload.tar.gz"
          : > "${encoded}"

          chunk_shas=(
            cde84c7c63246b4e30e2a10b1bff34069328cb9f
            8d3bcbed85910fb728bc62ee8e7a301ff8174057
            8d3f61f901d0bbb43192ab90dd1c548ca35ecdfb
            72079cc049d96764bfc324678b17a0d7ea1ed950
            8858589a4be11d55a6d566779f33b32814de6556
            c4edcd8592f96ddbf7d0eb4a6ade7c77f7a8238b
            9bfcac69e69d707f37a8a5c01c12d3a484a8267
            a3517af8251eaf57de4bf1627d06ab72345111af
          )

          for sha in "${chunk_shas[@]}"; do
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 --decode >> "${encoded}"
          done

          base64 --decode "${encoded}" > "${payload}"
          echo "2ef01c99e0da302accec21e22f22c8c8786743da2239d876b9235199bd5607c9  ${payload}" | sha256sum -c -
          tar -xzf "${payload}" -C "${RUNNER_TEMP}"
          test -f "${RUNNER_TEMP}/MYNT-3.5.0-ai-hardening/apply.py"

      - name: Apply reviewed source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/MYNT-3.5.0-ai-hardening/apply.py"

      - name: Run static and unit validation
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ai-core.js
          node --check scripts/productivity-actions.js
          node --check scripts/ai-assist.js
          node tools/check-customizations.mjs
          node tools/check-release-metadata.mjs
          node tools/check-upstream-integration.mjs
          node tools/check-ai-assist.mjs
          node tools/test-ai-core.mjs
          node tools/test-productivity-actions.mjs
          node tools/build-web-preview.mjs
          node tools/check-web-preview.mjs

      - name: Install Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/install-chrome-for-testing.py

      - name: Run source extension browser validation
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          xvfb-run -a node tools/smoke-chromium.mjs
          xvfb-run -a node tools/smoke-ai-assist.mjs

      - name: Commit verified hardening and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git rm .github/workflows/apply-reviewed-ai-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(ai): harden and modularize AI Assist"
          git push origin HEAD:feature/ai-assist-3.5.0
