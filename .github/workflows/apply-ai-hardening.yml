name: Apply AI Assist hardening

on:
  push:
    branches:
      - feature/ai-assist-3.5.0
    paths:
      - .github/workflows/apply-ai-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    name: Apply and verify AI Assist hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout AI Assist branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/ai-assist-3.5.0
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Restore and apply verified hardening payload
        shell: bash
        run: |
          set -euo pipefail
          payload_root="$RUNNER_TEMP/mynt-ai-hardening"
          archive="$RUNNER_TEMP/mynt-ai-hardening.tar.gz"
          mkdir -p "$payload_root"
          export MYNT_HARDENING_ARCHIVE="$archive"
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path

          expected_chunks = {
              'chunk-00.b64': '213e73a56ec806c3c25295a5fc2c49538ca078126c6d31e065ee023c610ce5f0',
              'chunk-01.b64': '48661179073ff860fb06f187946945d313014688ba20707d865d3dccd4d9fe8d',
              'chunk-02.b64': '3efe48cefc867bb17d055226b683809577077e74d74ffff126148b81dd050869',
              'chunk-03.b64': '1e18bf94c4c5f4c2b41e305663dc90de9a67ae246feb8aab02a546dcdf814981',
              'chunk-04.b64': '73962b6dff2be286b17c2899666c90f4515ff1e7be03722b4af5e5bfadf32f59',
              'chunk-05.b64': '8d9bd22a0d45dc13cdb68168282b5e82697807cfe1269786d21b8096f5fc3b1a',
          }

          parts = []
          mismatches = []
          paths = sorted(Path('.integration/ai-hardening').glob('chunk-*.b64'))
          if [path.name for path in paths] != list(expected_chunks):
              raise SystemExit(f'Unexpected hardening chunk set: {[path.name for path in paths]}')

          for path in paths:
              raw = path.read_text(encoding='ascii')
              clean = ''.join(raw.split())
              digest = hashlib.sha256(clean.encode('ascii')).hexdigest()
              print(f'{path}: raw={len(raw)} clean={len(clean)} mod4={len(clean) % 4} sha256={digest}')
              if digest != expected_chunks[path.name]:
                  mismatches.append(f'{path.name}: expected {expected_chunks[path.name]}, got {digest}')
              parts.append(clean)

          if mismatches:
              raise SystemExit('Hardening payload chunk mismatch:\n' + '\n'.join(mismatches))

          encoded = ''.join(parts)
          print(f'payload-base64: chars={len(encoded)} mod4={len(encoded) % 4}')
          if len(encoded) % 4:
              raise SystemExit('Hardening payload Base64 length is invalid.')

          try:
              payload = base64.b64decode(encoded, validate=True)
          except Exception as error:
              raise SystemExit(f'Hardening payload Base64 validation failed: {error}') from error

          digest = hashlib.sha256(payload).hexdigest()
          expected = '5c48c2b7dc28c674beba998224a52336872341ffaf18dcafcc31ca70c50ec3ce'
          print(f'payload-sha256: {digest}')
          if digest != expected:
              raise SystemExit(f'Hardening payload digest mismatch: expected {expected}, got {digest}')

          Path(os.environ['MYNT_HARDENING_ARCHIVE']).write_bytes(payload)
          PY
          tar -xzf "$archive" -C "$payload_root"
          export MYNT_HARDENING_PAYLOAD="$payload_root"
          python3 "$payload_root/apply.py"

          # The committed Pomodoro source uses LF. Normalize runner-side CRLF so
          # the final commit contains only the actual event-contract change.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/pomodoro.js')
          path.write_bytes(path.read_bytes().replace(b'\r\n', b'\n'))
          PY

      - name: Run static and unit gates
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ai-assist.js
          node --check scripts/dashboard-tools.js
          node --check scripts/pomodoro.js
          node --check tools/smoke-chromium.mjs
          node tools/check-customizations.mjs
          node tools/check-release-metadata.mjs
          node tools/check-upstream-integration.mjs
          node tools/check-ai-assist.mjs
          node tools/test-ai-assist.mjs
          node tools/build-web-preview.mjs
          node tools/check-web-preview.mjs
          python3 -m py_compile tools/install-chrome-for-testing.py
          git diff --check

      - name: Install Chrome for Testing
        run: python3 tools/install-chrome-for-testing.py

      - name: Run real Chromium AI smoke
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          xvfb-run -a node tools/smoke-chromium.mjs

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-ai-hardening.yml
          git rm -r .integration/ai-hardening
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): harden event contracts and end-to-end tests"
          git push origin HEAD:feature/ai-assist-3.5.0
