name: Apply AI Assist integration

on:
  push:
    branches:
      - feature/ai-assist-3.5.0
    paths:
      - .github/workflows/apply-ai-assist.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout AI Assist branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/ai-assist-3.5.0
          fetch-depth: 0

      - name: Integrate AI Assist into UI and docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence of {old!r}, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "index.html",
              '    <script defer src="scripts/ai-tools.js"></script>\n',
              '    <script defer src="scripts/ai-tools.js"></script>\n    <script defer src="scripts/ai-assist.js"></script>\n',
          )

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("version-3.4.0-blue", "version-3.5.0-blue")
          text = text.replace("Version 3.4.0", "Version 3.5.0")
          text = text.replace("| Chromium browsers | Manifest V3 (`manifest.json`) | `3.4.0` |", "| Chromium browsers | Manifest V3 (`manifest.json`) | `3.5.0` |")
          text = text.replace("| Firefox / Zen | Manifest V2 (`manifest(firefox).json`) | `3.4.0` |", "| Firefox / Zen | Manifest V2 (`manifest(firefox).json`) | `3.5.0` |")

          highlight = "- **Today dashboard** — choose three priorities, track completion progress, and surface the next action.\n"
          ai_highlight = highlight + "- **AI Assist** — plan today's Top 3 and organize Scratchpad notes using Chrome built-in AI when available, with a private local fallback and a full Off mode.\n"
          if "**AI Assist**" not in text:
              if highlight not in text:
                  raise SystemExit("README: Today dashboard highlight anchor missing")
              text = text.replace(highlight, ai_highlight, 1)

          core = "- Configurable AI tool launchers with right-click settings access\n"
          ai_core = core + "- Local-first AI Assist for Today planning and Scratchpad organization; no cloud AI endpoint or API key is included in v3.5.0\n"
          if "Local-first AI Assist for Today planning" not in text:
              if core not in text:
                  raise SystemExit("README: AI tools core-feature anchor missing")
              text = text.replace(core, ai_core, 1)

          privacy_anchor = "MYNT also uses browser storage (`localStorage` and IndexedDB) for interface settings and productivity data. Weather and other optional features may contact their documented third-party services when enabled.\n"
          privacy_note = privacy_anchor + "\nAI Assist v3.5.0 does not add a cloud AI endpoint. In `Auto` mode it tries Chrome's built-in Prompt API on supported desktop Chrome installations and otherwise uses deterministic local JavaScript. AI suggestions are never applied until you explicitly choose an action such as **Apply suggestion**, **Add tasks**, or **Replace scratchpad**.\n"
          if "AI Assist v3.5.0 does not add a cloud AI endpoint" not in text:
              if privacy_anchor not in text:
                  raise SystemExit("README: privacy anchor missing")
              text = text.replace(privacy_anchor, privacy_note, 1)

          qa_anchor = "node tools/check-customizations.mjs\n"
          if "node tools/check-ai-assist.mjs" not in text:
              if qa_anchor not in text:
                  raise SystemExit("README: QA command anchor missing")
              text = text.replace(qa_anchor, qa_anchor + "node tools/check-ai-assist.mjs\n", 1)
          readme.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          release = """## Reese-max 3.5.0 — AI Assist - Aug 27, 2026

### Added

- Added local-first **AI Assist** for Today planning and Scratchpad organization.
- Added provider modes: `Auto`, Chrome built-in AI, local smart assist, and `Off`.
- Added Chrome Prompt API feature detection with automatic local fallback when the on-device model is unavailable.
- Added explicit user-controlled actions for applying Top 3 suggestions, adding extracted tasks, and replacing Scratchpad content.

### Privacy

- No cloud AI endpoint, API key, analytics, or remote AI JavaScript was added in v3.5.0.
- Auto/Chrome mode uses Chrome's browser-managed model when available; the fallback runs deterministic JavaScript locally.

"""
          anchor = "## [Unreleased](https://github.com/prem-k-r/MaterialYouNewTab/compare/v3.3...main)"
          if "## Reese-max 3.5.0 — AI Assist" not in text:
              if anchor not in text:
                  raise SystemExit("CHANGELOG: Unreleased anchor missing")
              text = text.replace(anchor, release + anchor, 1)
          changelog.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-ai-assist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md CHANGELOG.md
          git commit -m "feat(ai): wire AI Assist into MYNT 3.5.0"
          git push origin HEAD:feature/ai-assist-3.5.0
