name: Repair shortcut runtime

on:
  push:
    branches:
      - feature/upstream-full-integration
    paths:
      - tools/shortcut-runtime-repair.mjs
      - .github/workflows/shortcut-runtime-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v7
        with:
          ref: feature/upstream-full-integration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply shortcut runtime repairs
        run: node tools/shortcut-runtime-repair.mjs

      - name: Commit repaired runtime and tests
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/shortcuts.js locales/en.js locales/zh_TW.js tools/check-upstream-integration.mjs
          git commit -m "fix: restore custom shortcut icon runtime"
          git push origin HEAD:feature/upstream-full-integration

      - name: Run customization checks
        run: node tools/check-customizations.mjs

      - name: Run release metadata checks
        run: node tools/check-release-metadata.mjs

      - name: Run upstream integration checks
        run: node tools/check-upstream-integration.mjs
